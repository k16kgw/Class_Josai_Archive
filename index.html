<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>城西大学 講義ノートアーカイブ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #f5f7f8;
      }

      body {
        margin: 0;
      }

      main {
        width: min(720px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 32px;
        line-height: 1.8;
        color: #4a5056;
      }

      section {
        border-top: 1px solid #cfd5da;
        padding-top: 24px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 1.25rem;
        letter-spacing: 0;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid #1769aa;
        border-radius: 6px;
        color: #0b5794;
        background: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        color: #fff;
        background: #1769aa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>城西大学 講義ノートアーカイブ</h1>
      <p>過年度の講義ノートを年度別に公開しています。</p>
      <section aria-labelledby="freshman-seminar-ii">
        <h2 id="freshman-seminar-ii">フレッシュマンセミナーII</h2>
        <a href="./2025/">2025年度の講義ノート</a>
      </section>
    </main>
  </body>
</html>
