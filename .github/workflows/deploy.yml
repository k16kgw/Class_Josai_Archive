name: Deploy lecture archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MyST
        run: npm install --global mystmd@1.9.0

      - name: Build 2025 lecture notes
        working-directory: 2025
        env:
          BASE_URL: /${{ github.event.repository.name }}/2025
        run: myst build --html --ci

      - name: Assemble archive site
        run: |
          mkdir -p public/2025
          cp index.html public/index.html
          cp -R 2025/_build/html/. public/2025/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
